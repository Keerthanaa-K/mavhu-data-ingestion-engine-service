
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mavhu'
version = '0.0.1-SNAPSHOT'
description = 'mavhu-data-ingestion-engine-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}



ext {
    set('springCloudAwsVersion', '3.2.1')
    set('mockito.version', '5.14.2')     // or whatever is latest at time of build
}

configurations.all {
    resolutionStrategy {
        force 'org.mockito:mockito-core:5.14.2'
        force 'net.bytebuddy:byte-buddy:1.15.11'
        force 'net.bytebuddy:byte-buddy-agent:1.15.11'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-sqs'

    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    implementation 'software.amazon.awssdk:sts'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:${springCloudAwsVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // Pinned byte-buddy 1.15.x predates Java 25; experimental mode lets Mockito mock on newer class files.
    jvmArgs '-Dnet.bytebuddy.experimental=true'
}
