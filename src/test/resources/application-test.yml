spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql,classpath:db/ddl/esg_file_ingestion.sql,classpath:db/ddl/esg_file_approval.sql
  datasource:
    url: jdbc:h2:mem:mavhu_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true
  cloud:
    aws:
      sqs:
        enabled: false
      s3:
        enabled: false

app:
  datasource:
    initialize-database: false
